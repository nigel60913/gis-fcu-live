<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#073B5C" />
    <title>ESG × MM｜Live Display</title>
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/v2.css?v=2.9.6" />
    <link id="lotteryTheme" rel="stylesheet" href="css/lottery.css?v=1.3.0" disabled />
    <link
      id="displayTheme"
      rel="stylesheet"
      href="css/display.css?v=2.9.8"
      disabled
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body class="display-body">
    <div id="network" class="network" hidden></div>
    <main id="screen" class="display-screen">
      <div class="display-loading">
        <span class="spinner"></span>
        <p>正在連接 Live Session</p>
      </div>
    </main>
    <template id="displayLotteryTemplate">
      <section id="lotteryStage" class="lottery-stage" hidden>
        <div class="lottery-aurora" aria-hidden="true"><i></i><i></i><i></i></div>
        <header class="lottery-header">
          <div class="lottery-brand">
            <img src="assets/logo.png" alt="GIS.FCU" />
            <div><strong>ESG × MM</strong><small>GROUP BENEFITS LUCKY DRAW</small></div>
          </div>
          <div class="header-actions">
            <a class="guide-link" href="admin.html">← 返回 Admin</a>
            <label class="volume-control" title="抽獎音量">
              <button id="btnMute" type="button" class="mute-button" aria-label="靜音抽獎音效">🔊</button>
              <input id="volumeSlider" type="range" min="0" max="100" step="1" value="70" aria-label="抽獎音量" />
              <output id="volumeValue">70%</output>
            </label>
          </div>
        </header>

        <section id="introView" class="intro-view">
          <div class="intro-copy">
            <span class="kicker">福利獎勵更多元・運用更彈性</span>
            <h1>集團福利點數<br /><em>幸運抽獎</em></h1>
            <ul class="intro-text benefit-copy">
              <li>集團福利點數可透過活動參與、優良表現或公司獎勵取得。</li>
              <li>點數可匯入個人的有福企小樹點帳戶。</li>
              <li>小樹點可運用於餐飲、購物、票券、旅遊及其他合作福利服務。</li>
              <li>實際點數發放與使用規則依公司及集團公告為準。</li>
            </ul>
            <div class="point-equation" aria-label="集團點一點等於小樹點一點等於新臺幣一元">
              <article><span class="point-icon">P</span><strong>集團點 1 點</strong></article>
              <b>=</b>
              <article><span class="leaf-icon">◆</span><strong>小樹點 1 點</strong></article>
              <b>=</b>
              <article><span class="coin-icon">1</span><strong>新臺幣 1 元</strong></article>
            </div>
            <div class="draw-summary" aria-live="polite">
              <article><span>已讀取答題紀錄數</span><strong id="recordCount">讀取中</strong></article>
              <article><span>去重後有效參與者數</span><strong id="participantCount">讀取中</strong></article>
              <article><span>預計抽出人數</span><strong id="winnerCount">—</strong></article>
            </div>
            <div class="intro-actions">
              <button id="btnDraw" class="draw-button" disabled>
                <span>✦</span><strong>開始抽獎</strong><small>5 秒後一次公布 20 位</small>
              </button>
              <button id="btnReload" class="secondary-button">重新讀取名單</button>
            </div>
            <p id="poolMessage" class="pool-message">正在彙整全部題目的答題者資料…</p>
          </div>
          <aside class="benefit-card" aria-label="集團福利點數機制">
            <div class="benefit-orbit"><i></i><i></i><i></i></div>
            <div class="benefit-logo">P</div>
            <h2>點數如何運作？</h2>
            <ol>
              <li><b>01</b><span><strong>獲得集團點</strong>參與活動、優良表現或公司獎勵</span></li>
              <li><b>02</b><span><strong>匯入小樹點</strong>點數進入個人有福企小樹點帳戶</span></li>
              <li><b>03</b><span><strong>自由使用</strong>餐飲、購物、旅遊、票券與多元福利</span></li>
            </ol>
            <p>福利不再只有一種選擇</p>
          </aside>
        </section>

        <section id="drawingView" class="drawing-view" hidden aria-live="polite">
          <span class="kicker">LUCKY DRAW IN PROGRESS</span>
          <h1 id="drawStatus">幸運名單抽選中</h1>
          <div class="drawing-core">
            <div class="draw-rings" aria-hidden="true"><i></i><i></i><i></i></div>
            <div id="drawCountdown" class="draw-countdown">5</div>
            <span>秒後揭曉</span>
          </div>
          <div id="rollingNames" class="rolling-names"></div>
          <p>系統正在從全部答題者中隨機抽選，得獎者不重複。</p>
        </section>

        <section id="resultView" class="result-view" hidden aria-live="assertive">
          <div id="confetti" class="confetti" aria-hidden="true"></div>
          <div class="result-head">
            <div>
              <span class="kicker">CONGRATULATIONS</span>
              <h1>恭喜本次得獎者</h1>
              <p id="resultMeta">共 20 位幸運得主</p>
            </div>
            <div class="result-actions">
              <button id="btnExport" class="export-button" disabled>↓ 匯出得獎名單 CSV</button>
              <button id="btnDrawAgain" class="secondary-button">重新抽獎</button>
            </div>
          </div>
          <div id="winnerGrid" class="winner-grid"></div>
          <footer class="result-footer">
            <span>集團點 1 點</span><b>=</b><span>小樹點 1 點</span><b>=</b><span>新臺幣 1 元</span>
          </footer>
        </section>
      </section>
    </template>
    <script type="module" src="js/display.js?v=2.9.9"></script>
  </body>
</html>
