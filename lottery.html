<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在返回投影頁</title>
  <meta http-equiv="refresh" content="0;url=display.html">
  <script>
    const target = new URL('./display.html', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</head>
<body><p>抽獎功能已整合至 display.html，正在返回投影頁……</p></body>
</html>
